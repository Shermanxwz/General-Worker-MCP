name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tests:
    name: Hook and installer (Python ${{ matrix.python }})
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    strategy:
      fail-fast: false
      matrix:
        python: ['3.10', '3.14']
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python }}
      - name: Install test dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y jq
          python -m pip install 'PyYAML>=6,<7'
      - name: Check shell and Python syntax
        run: |
          sh -n install.sh
          sh -n tests/test-hook.sh
          python -m py_compile tests/*.py
      - name: Test the Claude hook
        run: sh tests/test-hook.sh
      - name: Test metadata and isolated install lifecycle
        run: python -m unittest discover -s tests -p 'test_*.py' -v

  codex-discovery:
    name: Native Codex skill discovery (no model calls)
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          package-manager-cache: false
      - name: Install the tested Codex CLI version
        run: |
          npm install --prefix "$RUNNER_TEMP/codex-cli" --no-audit --no-fund @openai/codex@0.163.0
          echo "$RUNNER_TEMP/codex-cli/node_modules/.bin" >> "$GITHUB_PATH"
      - name: Discover this checkout's skill in an isolated project
        run: |
          project_dir=$(mktemp -d "$RUNNER_TEMP/worker-project-XXXXXX")
          git init -q "$project_dir"
          CODEX_SKILLS_DIR="$project_dir/.agents/skills" sh install.sh install codex
          codex --version
          python tests/check-codex-skills.py --cwd "$project_dir" \
            --expected-path "$project_dir/.agents/skills/worker/SKILL.md"
