name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint (shellcheck, node --check, py_compile, JSON and workflow YAML)
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
          package-manager-cache: false
      - name: Install PyYAML
        run: python -m pip install --disable-pip-version-check 'PyYAML==6.0.3'
      - name: Shell scripts (shellcheck 0.11.0.1, POSIX sh)
        run: |
          set -eu
          # Pinned from PyPI and run by full path, so the runner's preinstalled shellcheck is never used.
          sc_dir="$RUNNER_TEMP/shellcheck-0.11.0.1"
          python -m pip install --disable-pip-version-check --target "$sc_dir" 'shellcheck-py==0.11.0.1'
          "$sc_dir/bin/shellcheck" --version
          "$sc_dir/bin/shellcheck" -s sh install.sh scripts/*.sh
      - name: Node module syntax (node --check)
        run: |
          set -eu
          files=$(git ls-files '*.mjs')
          if [ -z "$files" ]; then
            echo "no tracked .mjs files" >&2
            exit 1
          fi
          for file in $files; do
            node --check "$file"
          done
      - name: Python test syntax (py_compile)
        run: python -m py_compile tests/*.py
      - name: JSON files and workflow YAML parse
        run: |
          set -eu
          python - <<'PY'
          import json
          import subprocess

          import yaml

          paths = subprocess.run(
              ["git", "ls-files", "*.json"],
              check=True, capture_output=True, text=True,
          ).stdout.split()
          if not paths:
              raise SystemExit("no tracked .json files")
          for path in paths:
              with open(path, encoding="utf-8") as handle:
                  json.load(handle)
              print("json ok:", path)
          with open(".github/workflows/ci.yml", encoding="utf-8") as handle:
              yaml.safe_load(handle)
          print("yaml ok: .github/workflows/ci.yml")
          PY

  tests:
    name: Python tests (Python ${{ matrix.python }})
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        python: ['3.10', '3.14']
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python }}
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
          package-manager-cache: false
      - name: Install test dependencies
        run: python -m pip install --disable-pip-version-check 'PyYAML==6.0.3'
      - name: Run Python tests (release, metadata, installer, probes)
        run: python -m unittest discover -s tests -p 'test_*.py' -v

  node-tests:
    name: Node tests (Node ${{ matrix.node }})
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        node: ['22', '24']
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: ${{ matrix.node }}
          package-manager-cache: false
      - name: Run Node tests (hook and MCP server)
        run: node --test tests/*.test.mjs

  claude-plugin:
    name: Claude Code plugin validation and install round trip (no login)
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      DISABLE_AUTOUPDATER: '1'
      CLAUDE_CODE_DISABLE_NONESSENTIAL_TRAFFIC: '1'
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
          package-manager-cache: false
      - name: Install the tested Claude Code CLI version
        run: |
          npm install --prefix "$RUNNER_TEMP/claude-cli" --no-audit --no-fund @anthropic-ai/claude-code@2.1.295
          echo "$RUNNER_TEMP/claude-cli/node_modules/.bin" >> "$GITHUB_PATH"
      - name: Validate the marketplace and the plugin
        run: |
          claude --version
          claude plugin validate .
          claude plugin validate plugins/worker
      - name: Install, check and uninstall through install.sh (temp HOME)
        env:
          CLAUDE_BIN: ${{ runner.temp }}/claude-cli/node_modules/.bin/claude
          WORKER_MARKETPLACE_SOURCE: ${{ github.workspace }}
        run: |
          set -eu
          export HOME="$RUNNER_TEMP/claude-home"
          export CLAUDE_CONFIG_DIR="$HOME/.claude"
          mkdir -p "$CLAUDE_CONFIG_DIR"

          sh install.sh install claude
          "$CLAUDE_BIN" plugin list > "$RUNNER_TEMP/plugins-installed.txt"
          if ! grep -q 'worker@general-worker-mcp' "$RUNNER_TEMP/plugins-installed.txt"; then
            echo "plugin is not listed after install" >&2
            exit 1
          fi

          sh install.sh status claude

          sh install.sh uninstall claude
          "$CLAUDE_BIN" plugin list > "$RUNNER_TEMP/plugins-removed.txt"
          if grep -q 'worker@general-worker-mcp' "$RUNNER_TEMP/plugins-removed.txt"; then
            echo "plugin is still listed after uninstall" >&2
            exit 1
          fi

  codex:
    name: Codex skill, MCP server and managed hooks (no model calls)
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          package-manager-cache: false
      - name: Install the tested Codex CLI version
        run: |
          npm install --prefix "$RUNNER_TEMP/codex-cli" --no-audit --no-fund @openai/codex@0.163.0
          echo "$RUNNER_TEMP/codex-cli/node_modules/.bin" >> "$GITHUB_PATH"
      - name: Prepare isolated Codex paths and a temp project
        run: |
          set -eu
          project_dir=$(mktemp -d "$RUNNER_TEMP/worker-project-XXXXXX")
          git init -q "$project_dir"
          mkdir -p "$RUNNER_TEMP/codex-home"
          {
            echo "WORKER_PROJECT=$project_dir"
            echo "CODEX_HOME=$RUNNER_TEMP/codex-home"
            echo "WORKER_HOME=$RUNNER_TEMP/worker-home"
          } >> "$GITHUB_ENV"
      - name: Install the Codex target as root with the default requirements file and skills dir
        run: |
          set -eu
          # The runner image has no /etc/codex; create it the way an admin would.
          sudo install -d -m 0755 /etc/codex
          # sudo resets PATH, so pass the Node and Codex binaries and PATH explicitly.
          sudo env PATH="$PATH" \
            NODE_BIN="$(command -v node)" \
            CODEX_BIN="$(command -v codex)" \
            CODEX_HOME="$CODEX_HOME" \
            WORKER_HOME="$WORKER_HOME" \
            sh install.sh install codex
      - name: Check the admin skill with native Codex skills/list (no model calls)
        run: |
          python tests/check-codex-skills.py --cwd "$WORKER_PROJECT" \
            --expected-path /etc/codex/skills/worker/SKILL.md
      - name: Check that codex mcp list --json has a server named exactly worker
        run: |
          set -eu
          codex mcp list --json > "$RUNNER_TEMP/mcp-list.json"
          cat "$RUNNER_TEMP/mcp-list.json"
          node -e 'const list = JSON.parse(require("fs").readFileSync(0, "utf8")); for (const server of list) console.log(server.name);' \
            < "$RUNNER_TEMP/mcp-list.json" > "$RUNNER_TEMP/mcp-names.txt"
          grep -qx worker "$RUNNER_TEMP/mcp-names.txt"
      - name: Check that codex lists the managed worker hook (no model calls)
        run: |
          python tests/check-codex-hooks.py --cwd "$WORKER_PROJECT" \
            --expect "$WORKER_HOME/runtime/worker-hook.mjs"
      - name: Uninstall the Codex target and check that it is gone
        run: |
          set -eu
          sudo env PATH="$PATH" \
            NODE_BIN="$(command -v node)" \
            CODEX_BIN="$(command -v codex)" \
            CODEX_HOME="$CODEX_HOME" \
            WORKER_HOME="$WORKER_HOME" \
            sh install.sh uninstall codex

          if [ -e /etc/codex/skills/worker/SKILL.md ]; then
            echo "admin skill is still in /etc/codex/skills/worker" >&2
            exit 1
          fi

          # The managed block must be gone; the file itself may be removed entirely.
          if [ -e /etc/codex/requirements.toml ]; then
            rc=0
            sudo grep -Eq '^# (>>>|<<<) general-worker-mcp' /etc/codex/requirements.toml || rc=$?
            if [ "$rc" -eq 0 ]; then
              echo "managed block is still in /etc/codex/requirements.toml" >&2
              exit 1
            fi
            if [ "$rc" -ne 1 ]; then
              echo "could not read /etc/codex/requirements.toml (grep exit $rc)" >&2
              exit 1
            fi
          fi

          codex mcp list --json > "$RUNNER_TEMP/mcp-after.json"
          node -e 'const list = JSON.parse(require("fs").readFileSync(0, "utf8")); for (const server of list) console.log(server.name);' \
            < "$RUNNER_TEMP/mcp-after.json" > "$RUNNER_TEMP/mcp-after-names.txt"
          if grep -qx worker "$RUNNER_TEMP/mcp-after-names.txt"; then
            echo "worker is still listed by codex mcp list --json after uninstall" >&2
            exit 1
          fi
